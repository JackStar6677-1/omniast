<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="OmniAST / GraphLang — The Universal Graph-Native Kernel for Autonomous AI Systems &amp; Engine Interop">
  <defs>
    <!-- Background void &amp; celestial nebulae -->
    <linearGradient id="voidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="25%" stop-color="#090d24"/>
      <stop offset="55%" stop-color="#0b1736"/>
      <stop offset="85%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>

    <radialGradient id="nebulaViolet" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaCyan" cx="75%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="40%" r="35%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <!-- Typography Gradients -->
    <linearGradient id="omniTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E0E7FF"/>
      <stop offset="28%" stop-color="#38BDF8"/>
      <stop offset="65%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <linearGradient id="cyberBorderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#F472B6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="wireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="astGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38BDF8" stroke-width="0.75" stroke-opacity="0.06"/>
      <circle cx="0" cy="0" r="1.2" fill="#818CF8" fill-opacity="0.3"/>
    </pattern>

    <!-- Glow Filters -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="hyperGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b1"/>
      <feGaussianBlur stdDeviation="14" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes pulseGlow { 0%,100% { opacity: 0.88; filter: drop-shadow(0 0 10px rgba(56,189,248,0.4)); } 50% { opacity: 1; filter: drop-shadow(0 0 24px rgba(167,139,250,0.7)); } }
      @keyframes orbitFlow { to { stroke-dashoffset: -200; } }
      @keyframes nodeBlink { 0%,100% { r: 5; opacity: 0.8; } 50% { r: 7.5; opacity: 1; filter: drop-shadow(0 0 8px #38BDF8); } }
      @keyframes aiCorePulse { 0%,100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.04); opacity: 1; filter: drop-shadow(0 0 16px #34D399); } }
      @keyframes borderShimmer { 0%,100% { stroke-opacity: 0.5; } 50% { stroke-opacity: 1; } }

      .title { font-family: 'Outfit', 'Inter', -apple-system, sans-serif; font-weight: 900; font-size: 54px; fill: url(#omniTitleGrad); animation: pulseGlow 4s ease-in-out infinite; letter-spacing: -0.5px; }
      .subtitle { font-family: 'Inter', -apple-system, sans-serif; font-weight: 500; font-size: 16px; fill: #94A3B8; letter-spacing: 0.5px; }
      .tagline { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; font-weight: 700; fill: #38BDF8; letter-spacing: 2.5px; text-transform: uppercase; }
      .badge-text { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; fill: #F8FAFC; }
      .orbit-line { stroke-dasharray: 10 14; animation: orbitFlow 12s linear infinite; }
      .node-pulse { animation: nodeBlink 3.2s ease-in-out infinite; }
      .core-box { transform-origin: 600px 145px; animation: aiCorePulse 5s ease-in-out infinite; }
      .border-shimmer { animation: borderShimmer 5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Deep Void Background -->
  <rect width="1200" height="440" rx="20" fill="url(#voidGrad)"/>
  <rect width="1200" height="440" rx="20" fill="url(#astGrid)"/>
  <rect width="1200" height="440" rx="20" fill="url(#nebulaViolet)"/>
  <rect width="1200" height="440" rx="20" fill="url(#nebulaCyan)"/>
  <circle cx="600" cy="145" r="220" fill="url(#coreGlow)"/>

  <!-- Graph AST Neural Mesh (Interactive &amp; Flowing Topology) -->
  <g class="orbit-line" stroke="url(#wireGrad)" stroke-width="1.6" fill="none" opacity="0.6">
    <!-- Center to peripheral neural nodes -->
    <path d="M 600 145 L 360 85"/>
    <path d="M 600 145 L 840 85"/>
    <path d="M 600 145 L 260 190"/>
    <path d="M 600 145 L 940 190"/>
    <path d="M 600 145 L 420 220"/>
    <path d="M 600 145 L 780 220"/>
    <!-- Cross links -->
    <path d="M 360 85 Q 310 135 260 190"/>
    <path d="M 840 85 Q 890 135 940 190"/>
    <path d="M 420 220 L 780 220"/>
    <path d="M 360 85 L 420 220"/>
    <path d="M 840 85 L 780 220"/>
  </g>

  <!-- AST Graph Nodes -->
  <!-- Left Side: AI Ingestion &amp; Universal Drivers -->
  <g filter="url(#softGlow)">
    <circle cx="360" cy="85" r="6" fill="#38BDF8" class="node-pulse"/>
    <text x="360" y="65" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#7DD3FC">claude / codex</text>

    <circle cx="260" cy="190" r="5" fill="#818CF8" class="node-pulse" style="animation-delay: 1s;"/>
    <text x="250" y="215" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#A5B4FC">deepseek / grok</text>

    <circle cx="420" cy="220" r="6" fill="#34D399" class="node-pulse" style="animation-delay: 1.5s;"/>
    <text x="420" y="245" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#6EE7B7">antigravity / sllm</text>
  </g>

  <!-- Right Side: Transpilation Targets &amp; Execution Runtimes -->
  <g filter="url(#softGlow)">
    <circle cx="840" cy="85" r="6" fill="#F472B6" class="node-pulse" style="animation-delay: 0.5s;"/>
    <text x="840" y="65" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#F472B6">JVM · Java 21/25</text>

    <circle cx="940" cy="190" r="5" fill="#38BDF8" class="node-pulse" style="animation-delay: 2s;"/>
    <text x="945" y="215" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38BDF8">Native · Rust / LLVM</text>

    <circle cx="780" cy="220" r="6" fill="#FBBF24" class="node-pulse" style="animation-delay: 2.5s;"/>
    <text x="780" y="245" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FDE68A">Paper / Spigot / Micro</text>
  </g>

  <!-- Central OmniAST Kernel Symbol -->
  <g class="core-box" filter="url(#hyperGlow)">
    <!-- Outer hexagon -->
    <polygon points="600,105 635,125 635,165 600,185 565,165 565,125" 
             fill="#0F172A" stroke="#38BDF8" stroke-width="2.5" opacity="0.95"/>
    <!-- Inner diamond -->
    <polygon points="600,120 622,145 600,170 578,145" 
             fill="url(#omniTitleGrad)" opacity="0.85"/>
    <circle cx="600" cy="145" r="5" fill="#FFFFFF"/>
  </g>
  <text x="600" y="205" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#38BDF8" letter-spacing="2">KERNEL CORE</text>

  <!-- Typography &amp; Headers -->
  <g text-anchor="middle">
    <!-- Tagline -->
    <text x="600" y="278" class="tagline">GRAPH-NATIVE · ZERO-BOILERPLATE · UNIVERSAL AI KERNEL</text>
    
    <!-- Title -->
    <text x="600" y="332" class="title">OmniAST / GraphLang</text>
    
    <!-- Subtitle -->
    <text x="600" y="362" class="subtitle">The executable AST language designed for AI models and autonomous systems to operate at graph-speed.</text>
  </g>

  <!-- Badges / Pill Containers -->
  <g transform="translate(240, 385)">
    <!-- Badge 1: Token Saver -->
    <g transform="translate(0, 0)">
      <rect width="165" height="30" rx="15" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2" opacity="0.9"/>
      <circle cx="16" cy="15" r="5" fill="#38BDF8"/>
      <text x="90" y="20" class="badge-text" text-anchor="middle">85% Token Saver</text>
    </g>

    <!-- Badge 2: Multi-Agent Ready -->
    <g transform="translate(180, 0)">
      <rect width="180" height="30" rx="15" fill="#1E293B" stroke="#818CF8" stroke-width="1.2" opacity="0.9"/>
      <circle cx="16" cy="15" r="5" fill="#818CF8"/>
      <text x="98" y="20" class="badge-text" text-anchor="middle">Claude·Codex·DeepSeek</text>
    </g>

    <!-- Badge 3: Multi-Target -->
    <g transform="translate(375, 0)">
      <rect width="160" height="30" rx="15" fill="#1E293B" stroke="#F472B6" stroke-width="1.2" opacity="0.9"/>
      <circle cx="16" cy="15" r="5" fill="#F472B6"/>
      <text x="88" y="20" class="badge-text" text-anchor="middle">Java 21 · Rust · Py</text>
    </g>

    <!-- Badge 4: Zero Jargon -->
    <g transform="translate(550, 0)">
      <rect width="170" height="30" rx="15" fill="#1E293B" stroke="#34D399" stroke-width="1.2" opacity="0.9"/>
      <circle cx="16" cy="15" r="5" fill="#34D399"/>
      <text x="93" y="20" class="badge-text" text-anchor="middle">AST First · Panama FFI</text>
    </g>
  </g>

  <!-- Outer Cyber Frame -->
  <rect x="1" y="1" width="1198" height="438" rx="19" fill="none" stroke="url(#cyberBorderGrad)" stroke-width="1.5" class="border-shimmer"/>
</svg>
